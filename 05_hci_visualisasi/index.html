<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survei dan Visualisasi</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><header><p class="eyebrow">STUDI KASUS 05</p><h1>Visualisasi Hasil Survei</h1><p>Masukkan nilai survei dan lihat hasilnya dalam bentuk grafik batang.</p></header><section class="card"><h2>Input data</h2><div class="fields"><label>Aspek A<input class="score" type="number" min="0" max="100" value="75"></label><label>Aspek B<input class="score" type="number" min="0" max="100" value="85"></label><label>Aspek C<input class="score" type="number" min="0" max="100" value="65"></label></div><button id="show">Perbarui Grafik</button><p id="average" class="average"></p></section><section class="card"><h2>Grafik nilai</h2><div id="chart" class="chart"></div></section></main><script src="script.js"></script></body></html>
